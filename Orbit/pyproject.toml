[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ntu-space-dynamics"
version = "0.1.0"
description = "Auditable spacecraft orbit, attitude, solar, power, and access analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "NTU Space Data Center"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "astropy>=5.3",
  "matplotlib>=3.7",
  "sgp4>=2.23",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5"]
ephemeris = ["jplephem>=2.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ntu_space_dynamics = ["data/gravity/*.gfc", "data/gravity/*.sha256", "data/gravity/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
