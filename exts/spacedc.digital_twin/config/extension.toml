[package]
title = "SpaceDC Digital Twin"
version = "1.0.0"
description = "ORBITAL DC-1 Space Data Center Digital Twin Simulator for NVIDIA Omniverse"
category = "Simulation"
keywords = ["space", "digital twin", "satellite", "data center", "thermal", "solar"]
authors = ["SpaceDC Team"]
readme = "docs/README.md"
repository = "https://github.com/Markliu225/SpaceDC"
icon = "data/icon.png"
preview_image = "data/preview.png"

[dependencies]
"omni.kit.uiapp" = {}
"omni.usd" = {}
"omni.ui" = {}
"omni.kit.commands" = {}
"omni.kit.window.property" = {}

[python.module]
name = "spacedc.digital_twin"

[[python.module.env]]
SPACEDC_ROOT = "${ext}"

[settings]
exts."spacedc.digital_twin".sim_speed = 60
exts."spacedc.digital_twin".default_wing_count = 8
exts."spacedc.digital_twin".default_rad_count = 6
